name: Complete v0.1.0-alpha assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/complete-v0.1.0-alpha.yml

permissions:
  contents: write

jobs:
  complete-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download uploaded IPA and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.1.0-alpha --repo "${{ github.repository }}" --pattern OpenStrike3GS.ipa
          gh release download v0.1.0-alpha --repo "${{ github.repository }}" --pattern installer

      - name: Verify uploaded binaries
        run: |
          set -euo pipefail
          echo "26f70d8d1e71ce8259587dd2331cbf102eea81d8430768e92900b69ff8653d20  OpenStrike3GS.ipa" | sha256sum -c -
          echo "0f12d9545340bfd63d9c9da799ef81f634c0df142e91e6fae7974373d9fb83b7  installer" | sha256sum -c -

      - name: Extract embedded PocketJS assets
        run: |
          set -euo pipefail
          unzip -p OpenStrike3GS.ipa Payload/OpenStrike3GS.app/OpenStrike3GS > OpenStrike3GS.bin
          python3 - <<'PY'
          from pathlib import Path
          data = Path("OpenStrike3GS.bin").read_bytes()
          js = data[2340856:2340856 + 182880]
          pak = data[2523744:2523744 + 1054752]
          Path("openstrike.js").write_bytes(js)
          Path("openstrike.pak").write_bytes(pak)
          PY
          echo "4fc53f33c5c9aa6ad281e181bf950b031e1c49f65a4721777f4e0e6964a9466d  openstrike.js" | sha256sum -c -
          echo "f844fd683a6124642b79b3bd107f637b692e68070d5c4c6f08fb62d9e005b539  openstrike.pak" | sha256sum -c -

      - name: Refresh checksums
        run: |
          cat > SHA256SUMS.txt <<'EOF'
          0f12d9545340bfd63d9c9da799ef81f634c0df142e91e6fae7974373d9fb83b7  installer
          26f70d8d1e71ce8259587dd2331cbf102eea81d8430768e92900b69ff8653d20  OpenStrike3GS.ipa
          4fc53f33c5c9aa6ad281e181bf950b031e1c49f65a4721777f4e0e6964a9466d  openstrike.js
          f844fd683a6124642b79b3bd107f637b692e68070d5c4c6f08fb62d9e005b539  openstrike.pak
          EOF

      - name: Upload remaining assets and checksum file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.1.0-alpha openstrike.js openstrike.pak SHA256SUMS.txt --clobber --repo "${{ github.repository }}"

      - name: Fix artifact name in release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.1.0-alpha --repo "${{ github.repository }}" --json body --jq .body > release-body.md
          sed -i 's/OpenStrike3GS-v0\.1\.0-alpha\.ipa/OpenStrike3GS.ipa/g' release-body.md
          gh release edit v0.1.0-alpha --repo "${{ github.repository }}" --notes-file release-body.md
